name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag (e.g., v2.3.13 -> 2.3.13)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $TAG_VERSION"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Rename JAR with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp target/seatunnel-transform-fieldconvert-*.jar \
             target/seatunnel-transform-fieldconvert-${VERSION}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## seatunnel-transform-fieldconvert ${{ steps.version.outputs.version }}

            SeaTunnel field convert transform plugin.

            ### Installation
            Download the JAR file below and place it in your SeaTunnel `lib/` directory.

            ### Usage
            ```hocon
            transform {
              FieldConvert {
                rules = [
                  {
                    table_pattern = "your_table.*"
                    fields = {
                      your_field = "unix_timestamp_to_datetime"
                    }
                  }
                ]
              }
            }
            ```
          files: |
            target/seatunnel-transform-fieldconvert-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
